name: Normalize repository formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format files currently failing the repository gate
        run: >-
          npx prettier --write
          backend/desktopBridge/services/fileImageProcessingPool.ts
          docs/MIGRATION.md
          migrated-tests/iris/server/bridgeRouteTestHarness.ts
          migrated-tests/iris/server/desktopBridgeRoutes.test.ts
          src/components/AgentActivityTimeline.tsx
          src/components/CodeEditor.tsx
          src/components/EditorPanel.tsx
          src/components/ExplorerPanel.tsx
          src/components/settings/ApplicationThemeSettings.tsx
          src/components/SettingsModal.tsx
          src/editor/applicationThemes.ts
          src/hooks/useEditorState.ts
          src/hooks/useWorkspace.ts
          src/platform/agent/runtime/readOnlyTerminalPolicy.ts
          src/platform/agent/runtime/sessionRunner.ts
          src/platform/agent/runtime/toolBroker.ts
          src/platform/settingsStorage.ts
          src/themes.css
          tests/EditorPanel.test.tsx

      - name: Remove one-shot workflow
        run: git rm .github/workflows/format-once.yml

      - name: Verify formatting diff
        run: |
          npm run format:check
          git diff --check

      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize repository formatting" -m "Apply the configured Prettier rules to files that predated the persistent formatting gate so verification starts from a clean baseline." -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:main
