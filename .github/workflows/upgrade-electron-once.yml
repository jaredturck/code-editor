name: Upgrade Electron runtime once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-electron-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update Electron dependency metadata
        run: npm install --save-dev electron@43.4.1 --package-lock-only --ignore-scripts

      - name: Install upgraded dependency graph
        run: npm ci

      - name: Verify upgraded runtime
        run: npm run verify:full

      - name: Remove one-shot workflow
        run: git rm .github/workflows/upgrade-electron-once.yml

      - name: Check diff
        run: git diff --check

      - name: Commit runtime upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/upgrade-electron-once.yml
          git commit -m "Upgrade Electron to supported runtime" -m "Move the desktop shell from Electron 31.7.7 to the maintained 43.4.1 line and verify formatting, lint, type safety, tests, Electron runtime checks, and production builds against the upgraded Chromium/Node runtime." -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:main
