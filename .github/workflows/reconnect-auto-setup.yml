name: Reconnect automatic model setup

on:
  push:
    paths:
      - .github/workflows/reconnect-auto-setup.yml

permissions:
  contents: write

jobs:
  reconnect-auto-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply reconnection patch
        run: python scripts/reconnect-auto-setup.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx prettier --write src/components/settings/AISettingsPanel.tsx tests/AISettingsPanel.test.tsx docs/CODE_CLEANUP_REVIEW.md

      - name: Verify changed-file formatting
        run: npx prettier --check src/components/settings/AISettingsPanel.tsx tests/AISettingsPanel.test.tsx docs/CODE_CLEANUP_REVIEW.md

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test AI settings integration
        run: npx vitest run tests/AISettingsPanel.test.tsx

      - name: Check diff
        run: git diff --check

      - name: Commit verified reconnection
        shell: bash
        run: |
          git rm .github/workflows/reconnect-auto-setup.yml scripts/reconnect-auto-setup.py
          git add src/components/settings/AISettingsPanel.tsx tests/AISettingsPanel.test.tsx docs/CODE_CLEANUP_REVIEW.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconnect automatic agent model setup" -m "Restore Auto Configure in AI Settings → Models, apply the existing hardware/provider-aware setup plan atomically, sync the selected local worker into the legacy Chat model setting, and cover success and error flows. Remove the resolved product decision from the cleanup review." -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:main
