name: Test Consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Consolidate and review tests
        run: |
          set -euo pipefail

          before_test_files=$(find tests migrated-tests -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' -o -name '*.test.jsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' -o -name '*.spec.jsx' \) | wc -l)

          # Retire tests that target deleted presentation/migration-only behavior.
          rm -f \
            migrated-tests/iris/lib/AuthContext.test.tsx \
            migrated-tests/iris/lib/legacyApiRetirement.test.ts \
            migrated-tests/iris/lib/localProfileClient.test.ts \
            migrated-tests/iris/lib/orbTextures.test.ts \
            migrated-tests/iris/lib/runtimeModularization.test.ts \
            migrated-tests/iris/lib/workspaceResize.test.ts

          mkdir -p tests/platform tests/backend tests/fixtures tests/helpers

          for file in migrated-tests/iris/lib/*.test.ts; do
            target="tests/platform/$(basename "$file")"
            test ! -e "$target"
            git mv "$file" "$target"
          done

          for file in migrated-tests/iris/server/*.test.ts; do
            target="tests/backend/$(basename "$file")"
            test ! -e "$target"
            git mv "$file" "$target"
          done

          git mv migrated-tests/iris/server/bridgeRouteTestHarness.ts tests/backend/bridgeRouteTestHarness.ts
          git mv migrated-tests/iris/fixtures/documentFixtures.ts tests/fixtures/documentFixtures.ts
          git mv migrated-tests/iris/fixtures/workspace tests/fixtures/workspace
          git mv migrated-tests/iris/helpers/http.ts tests/helpers/http.ts
          git mv migrated-tests/iris/setup.ts tests/runtimeSetup.ts
          git mv scripts/check-electron-runtime.cjs tests/electronRuntime.cjs

          # Retire migration-era naming while preserving the still-useful behavior coverage.
          git mv tests/platform/providerModularization.test.ts tests/platform/providerHelpers.test.ts
          git mv tests/batch2ExecutionPolicy.test.ts tests/autonomousExecutionBoundaries.test.ts

          rm -rf migrated-tests
          rm -f vitest.iris.config.ts

          python <<'PY'
          import json
          import re
          from pathlib import Path

          def rewrite_source_paths(text):
              text = text.replace("'../../../src/", "'../../src/")
              text = text.replace('"../../../src/', '"../../src/')
              text = text.replace("'../../../backend/", "'../../backend/")
              text = text.replace('"../../../backend/', '"../../backend/')
              text = text.replace("'../../../electron/", "'../../electron/")
              text = text.replace('"../../../electron/', '"../../electron/')
              text = text.replace("'../../server/", "'../../backend/")
              text = text.replace('"../../server/', '"../../backend/')
              text = text.replace("'../../src/lib/providers/", "'../../src/platform/providers/")
              text = text.replace('"../../src/lib/providers/', '"../../src/platform/providers/')
              text = text.replace('migrated-tests/iris/fixtures/workspace', 'tests/fixtures/workspace')
              text = re.sub(r"(['\"]\.\./\.\./backend/[^'\"]+)\.js(['\"])", r'\1\2', text)
              return re.sub(r"(['\"]\.\./\.\./src/platform/providers/[^'\"]+)\.js(['\"])", r'\1\2', text)

          for folder in [Path('tests/platform'), Path('tests/backend')]:
              for path in sorted(folder.glob('*.test.ts')):
                  path.write_text(rewrite_source_paths(path.read_text()))

          harness_path = Path('tests/backend/bridgeRouteTestHarness.ts')
          harness_path.write_text(rewrite_source_paths(harness_path.read_text()))

          runtime_setup_path = Path('tests/runtimeSetup.ts')
          runtime_setup = runtime_setup_path.read_text().replace('__irisPolyfilled', '__testPolyfilled')
          runtime_setup_path.write_text(runtime_setup)

          boundary_path = Path('tests/autonomousExecutionBoundaries.test.ts')
          boundary_path.write_text(
              boundary_path.read_text().replace(
                  "describe('Batch 2 autonomous execution boundaries'",
                  "describe('autonomous execution boundaries'",
              )
          )

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['test'] = 'npm run build:backend && npm run build:electron && vitest run'
          package['scripts'].pop('test:iris', None)
          package['scripts']['test:electron-runtime'] = 'electron tests/electronRuntime.cjs'
          package.get('devDependencies', {}).pop('vite-node', None)
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          config_path = Path('vitest.config.ts')
          config = config_path.read_text()
          old_test_config = "  test: {\n    environment: 'jsdom',\n    setupFiles: ['./tests/setup.ts'],\n    include: ['tests/**/*.test.ts', 'tests/**/*.test.tsx'],\n  },"
          new_test_config = (
              "  test: {\n"
              "    environment: 'jsdom',\n"
              "    projects: [\n"
              "      {\n"
              "        extends: true,\n"
              "        test: {\n"
              "          name: 'app',\n"
              "          setupFiles: ['./tests/setup.ts'],\n"
              "          include: ['tests/*.test.ts', 'tests/*.test.tsx'],\n"
              "        },\n"
              "      },\n"
              "      {\n"
              "        extends: true,\n"
              "        test: {\n"
              "          name: 'platform',\n"
              "          setupFiles: ['./tests/runtimeSetup.ts'],\n"
              "          include: ['tests/platform/**/*.test.ts', 'tests/backend/**/*.test.ts'],\n"
              "        },\n"
              "      },\n"
              "    ],\n"
              "  },"
          )
          if old_test_config not in config:
              raise SystemExit('Expected Vitest test configuration was not found')
          config_path.write_text(config.replace(old_test_config, new_test_config))

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace(
              '- Compatible migrated IRIS runtime tests included in `npm test`',
              '- Centralized platform/backend regression tests included in `npm test`',
          )
          readme = readme.replace(
              '`npm test` runs the Code Editor integration suite and then the compatible migrated IRIS runtime suite. `npm run verify:full` runs the complete correctness/build verification sequence.',
              '`npm test` runs the complete centralized `tests/` tree as isolated app and platform/backend projects. `npm run verify:full` runs the complete correctness/build verification sequence.',
          )
          readme_path.write_text(readme)

          migration_path = Path('docs/MIGRATION.md')
          migration = migration_path.read_text()
          migration = re.sub(
              r'^\| `migrated-tests/iris/`.*$',
              '| `tests/platform/`, `tests/backend/` | Consolidated runtime/backend regression tests retained from the migrated platform |',
              migration,
              flags=re.MULTILINE,
          )
          migration = migration.replace(
              '4. The important migrated runtime/backend tests and benchmark harness were retained.',
              '4. The important runtime/backend tests were retained and later consolidated into the normal `tests/` tree; stale presentation and migration-only tests were retired.',
          )
          tests_section = (
              '### Tests\n\n'
              '**IRIS source:** original IRIS runtime/backend tests  \n'
              '**Current destination:** `tests/platform/` and `tests/backend/`\n\n'
              'The original runtime/backend tests were initially preserved outside the normal Code Editor test tree so migration did not pretend old presentation tests remained valid against a different UI. After migration completion, useful coverage was consolidated into `tests/`. The normal Vitest configuration isolates app tests from platform/backend tests so their setup does not leak between groups. Presentation-only, dead-module, and migration-only tests were retired.\n\n'
              '### Historical IRIS documentation'
          )
          migration = re.sub(r'### Tests and benchmarks\n.*?### Historical IRIS documentation', tests_section, migration, flags=re.DOTALL)
          migration = re.sub(r'### Tests\n.*?### Historical IRIS documentation', tests_section, migration, flags=re.DOTALL)
          preserved_tests = (
              '### Preserved tests\n\n'
              '`tests/platform/` and `tests/backend/` retain useful runtime/backend regression coverage from the original test heritage alongside the Code Editor integration tests.\n\n'
              '### Git history'
          )
          migration = re.sub(r'### Preserved tests\n.*?### Git history', preserved_tests, migration, flags=re.DOTALL)
          unified_test_text = '`npm test` performs backend/Electron builds and runs the centralized Code Editor test tree as isolated app and platform/backend projects.\n\n### Verification state at documentation consolidation'
          migration = re.sub(r'`npm test` performs backend/Electron builds,.*?### Verification state at documentation consolidation', unified_test_text, migration, flags=re.DOTALL)
          migration = migration.replace('- [x] Compatible migrated IRIS tests in `npm test`', '- [x] Consolidated platform/backend regression coverage in `npm test`')
          migration_path.write_text(migration)

          removed_path = Path('docs/REMOVED_CODE.md')
          removed = removed_path.read_text()
          marker = '## Intentionally retained after review'
          entry = '''## 2026-08-26 — Centralized test tree and stale migration tests\n\nConsolidated the retained IRIS-derived runtime/backend regression tests into the normal `tests/` tree, removed the separate `migrated-tests/` hierarchy and `vitest.iris.config.ts`, and moved the Electron runtime smoke check under `tests/`.\n\nRemoved six tests that no longer represented current product behavior: deleted Auth/local-profile/Orb/workspace-resize surfaces, an obsolete runtime-modularization test targeting removed paths, and a migration-only hosted-API retirement assertion. Renamed the still-useful provider helper and autonomous-execution tests to remove migration-batch naming.\n\n---\n\n'''
          if entry not in removed:
              removed = removed.replace(marker, entry + marker)
          removed_path.write_text(removed)
          PY

          cat > tests/README.md <<'EOF'
          # Tests

          All executable repository tests live under this directory.

          - Top-level `*.test.ts` / `*.test.tsx`: Code Editor application, editor, Electron, and integration coverage using `setup.ts`.
          - `platform/`: agent runtime, providers, orchestration, policy, persistence-client, and other platform regression coverage using `runtimeSetup.ts`.
          - `backend/`: privileged bridge, storage, indexing, media, launcher, network, and security regression coverage using `runtimeSetup.ts`.
          - `fixtures/` and `helpers/`: shared test data and test-only utilities.
          - `electronRuntime.cjs`: Electron/node-pty runtime smoke check invoked by `npm run test:electron-runtime`.

          `runtimeSetup.ts` deliberately blocks uncontrolled network/browser transports and installs deterministic storage and credential mocks. Tests that need those capabilities must mock or explicitly control them.

          Run `npm test` for the centralized Vitest suite or `npm run verify:full` for formatting, linting, type checking, tests, Electron runtime verification, and the production build.
          EOF

          npm install --package-lock-only --ignore-scripts

          npx prettier --write \
            package.json \
            package-lock.json \
            vitest.config.ts \
            README.md \
            tests \
            docs/MIGRATION.md \
            docs/REMOVED_CODE.md

          after_test_files=$(find tests -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' -o -name '*.test.jsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' -o -name '*.spec.jsx' \) | wc -l)
          expected_after=$((before_test_files - 6))
          if [ "$after_test_files" -ne "$expected_after" ]; then
            echo "Expected exactly six stale test files to be retired: before=$before_test_files after=$after_test_files expected=$expected_after" >&2
            exit 1
          fi

          outside_tests=$(find . \
            -path './node_modules' -prune -o \
            -path './dist' -prune -o \
            -path './dist-electron' -prune -o \
            -path './backend-dist' -prune -o \
            -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' -o -name '*.test.jsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' -o -name '*.spec.jsx' \) \
            ! -path './tests/*' -print)
          if [ -n "$outside_tests" ]; then
            echo 'Test files remain outside tests/:' >&2
            echo "$outside_tests" >&2
            exit 1
          fi

          if git grep -n -E 'migrated-tests/iris|vitest\.iris|test:iris|scripts/check-electron-runtime' -- \
            ':!docs/iris-reference/**' \
            ':!docs/REMOVED_CODE.md' \
            ':!.github/workflows/test-consolidation.yml'; then
            echo 'Stale migrated-test references remain.' >&2
            exit 1
          fi

          if git grep -n -E "['\"]\.\./\.\./\.\./(src|backend|electron)/|['\"]\.\./\.\./server/|['\"]\.\./\.\./src/lib/providers/" -- tests/platform tests/backend; then
            echo 'Moved tests still contain stale source paths.' >&2
            exit 1
          fi

          if git grep -n -E '(describe|it|test)\.(only|skip|todo)' -- tests; then
            echo 'Focused, skipped, or todo tests remain in the centralized suite.' >&2
            exit 1
          fi

          rm -f .github/workflows/test-consolidation.yml

      - name: Verify repository
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npm run verify:full

      - name: Commit consolidation
        run: |
          set -euo pipefail
          git config user.name 'Jared'
          git config user.email 'jaredturck8@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit \
            -m 'Consolidate and review test suite' \
            -m 'Move retained platform and backend regression coverage into the single tests tree, retire six stale migration-era tests, centralize the Electron runtime check, and remove the separate migrated-test configuration.' \
            -m 'Co-authored-by: ChatGPT <noreply@openai.com>'
          git push origin HEAD:main
