name: Documentation Refresh

on:
  push:
    paths:
      - '.github/workflows/docs-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Refresh documentation
        run: python .github/docs-refresh.py

      - name: Install dependencies
        run: npm ci

      - name: Format current documentation
        run: npx prettier --write docs/README.md docs/MIGRATION.md docs/CODE_REVIEW_FINDINGS.md docs/CODE_CLEANUP_REVIEW.md docs/REMOVED_CODE.md docs/iris-reference/README.md

      - name: Verify repository
        run: npm run verify:full
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

      - name: Commit refreshed documentation
        run: |
          rm .github/workflows/docs-refresh.yml .github/docs-refresh.py
          git config user.name 'Jared'
          git config user.email 'jaredturck8@gmail.com'
          git add docs .github/workflows/docs-refresh.yml .github/docs-refresh.py
          git diff --cached --check
          git commit -m "Refresh documentation against current code" -m "Bring active migration and review documentation in sync with the post-cleanup repository, record recent removals, and clearly mark the preserved IRIS reference tree as historical." -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:main
