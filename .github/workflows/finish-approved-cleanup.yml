name: Finish approved cleanup

on:
  push:
    paths:
      - .github/workflows/finish-approved-cleanup.yml

permissions:
  contents: write

jobs:
  finish-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply remaining source hygiene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/desktopBridge/services/fileSemanticService.ts')
          text = path.read_text()

          old_import = "import type { FileExtractionKind, FileExtractionResult } from './fileExtractionWorkerTypes.js'"
          old_type = "\ntype ExtractedFileText = Exclude<FileExtractionResult, null>\n"
          old_local = "function shouldSkipProtectedPath(rootPath: string, absolutePath: string): boolean {\n  const relativePath = path.relative(rootPath, absolutePath)\n"

          assert old_import in text, 'expected FileExtractionResult import was not found'
          assert old_type in text, 'expected ExtractedFileText declaration was not found'
          assert old_local in text, 'expected unused relativePath declaration was not found'

          text = text.replace(old_import, "import type { FileExtractionKind } from './fileExtractionWorkerTypes.js'", 1)
          text = text.replace(old_type, "\n", 1)
          text = text.replace(old_local, "function shouldSkipProtectedPath(rootPath: string, absolutePath: string): boolean {\n", 1)
          path.write_text(text)
          PY

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies for verification
        run: npm ci --ignore-scripts

      - name: Format changed source
        run: npx prettier --write backend/desktopBridge/services/fileSemanticService.ts

      - name: Verify changed-file formatting
        run: npx prettier --check backend/desktopBridge/services/fileSemanticService.ts package-lock.json

      - name: Verify lint
        run: npm run lint

      - name: Verify types
        run: npm run typecheck

      - name: Check diff
        run: git diff --check

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/finish-approved-cleanup.yml
          git add package-lock.json backend/desktopBridge/services/fileSemanticService.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish approved cleanup synchronization" -m "Regenerate the lockfile after dependency pruning, remove the final confirmed semantic-index dead declarations, and retire the one-shot cleanup workflow after verification." -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:main
