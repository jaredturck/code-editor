name: Fix project skill probes

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'push' && github.event.head_commit.message != 'Handle optional project skill probes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file_path = Path(path)
              text = file_path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              file_path.write_text(text.replace(old, new, 1))

          replace(
              'electron/workspace.cts',
              """export async function read_agent_workspace_file(root_path: string, target_path: string) {\n  const target = await resolve_agent_workspace_target(root_path, target_path)\n  const target_stat = await stat(target.canonical_path)\n""",
              """export async function read_agent_workspace_file(root_path: string, target_path: string, optional = false) {\n  const target = await resolve_agent_workspace_target(root_path, target_path, optional)\n  if (!target.exists) {\n    return {\n      path: target.path,\n      content: '',\n      revision: '',\n      size: 0,\n      modified_time: 0,\n      missing: true,\n    }\n  }\n\n  const target_stat = await stat(target.canonical_path)\n""",
          )

          replace(
              'electron/workspace.cts',
              """export async function list_agent_workspace(root_path: string, target_path: string, depth = 3) {\n  const normalized_depth = Math.max(1, Math.min(6, Math.round(depth)))\n  const target = await resolve_agent_workspace_target(root_path, target_path)\n  const root_stat = await stat(target.canonical_path)\n""",
              """export async function list_agent_workspace(root_path: string, target_path: string, depth = 3, optional = false) {\n  const normalized_depth = Math.max(1, Math.min(6, Math.round(depth)))\n  const target = await resolve_agent_workspace_target(root_path, target_path, optional)\n  if (!target.exists) {\n    return {\n      rootPath: target.path,\n      tree: {\n        name: basename(target.path) || target.path,\n        path: target.path,\n        type: 'directory' as const,\n        children: [] as Array<Record<string, unknown>>,\n      },\n      truncated: false,\n      missing: true,\n    }\n  }\n\n  const root_stat = await stat(target.canonical_path)\n""",
          )

          replace(
              'electron/workspace.cts',
              """  ipcMain.handle('workspace:agent-read-file', async (_event, root_path: string, target_path: string) => {\n    return read_agent_workspace_file(root_path, target_path)\n  })\n""",
              """  ipcMain.handle(\n    'workspace:agent-read-file',\n    async (_event, root_path: string, target_path: string, optional = false) => {\n      return read_agent_workspace_file(root_path, target_path, optional)\n    },\n  )\n""",
          )

          replace(
              'electron/workspace.cts',
              """  ipcMain.handle('workspace:agent-list', async (_event, root_path: string, target_path: string, depth: number) => {\n    return list_agent_workspace(root_path, target_path, depth)\n  })\n""",
              """  ipcMain.handle(\n    'workspace:agent-list',\n    async (_event, root_path: string, target_path: string, depth: number, optional = false) => {\n      return list_agent_workspace(root_path, target_path, depth, optional)\n    },\n  )\n""",
          )

          replace(
              'electron/preload.cts',
              """    agent_read_file: (root_path: string, target_path: string) =>\n      ipcRenderer.invoke('workspace:agent-read-file', root_path, target_path),\n""",
              """    agent_read_file: (root_path: string, target_path: string, optional = false) =>\n      ipcRenderer.invoke('workspace:agent-read-file', root_path, target_path, optional),\n""",
          )

          replace(
              'electron/preload.cts',
              """    agent_list: (root_path: string, target_path: string, depth: number) =>\n      ipcRenderer.invoke('workspace:agent-list', root_path, target_path, depth),\n""",
              """    agent_list: (root_path: string, target_path: string, depth: number, optional = false) =>\n      ipcRenderer.invoke('workspace:agent-list', root_path, target_path, depth, optional),\n""",
          )

          replace(
              'src/types/electron.d.ts',
              """  agent_read_file: (\n    root_path: string,\n    target_path: string,\n  ) => Promise<{\n    path: string\n    content: string\n    revision: string\n    size: number\n    modified_time: number\n  }>\n""",
              """  agent_read_file: (\n    root_path: string,\n    target_path: string,\n    optional?: boolean,\n  ) => Promise<{\n    path: string\n    content: string\n    revision: string\n    size: number\n    modified_time: number\n    missing?: boolean\n  }>\n""",
          )

          replace(
              'src/types/electron.d.ts',
              """  agent_list: (\n    root_path: string,\n    target_path: string,\n    depth: number,\n  ) => Promise<{\n    rootPath: string\n    tree: { name: string; path: string; type: 'file' | 'directory'; children?: unknown[] }\n    truncated: boolean\n  }>\n""",
              """  agent_list: (\n    root_path: string,\n    target_path: string,\n    depth: number,\n    optional?: boolean,\n  ) => Promise<{\n    rootPath: string\n    tree: { name: string; path: string; type: 'file' | 'directory'; children?: unknown[] }\n    truncated: boolean\n    missing?: boolean\n  }>\n""",
          )

          replace(
              'src/chat/editorFileAuthority.ts',
              """        return window.editor_api.workspace.agent_list(\n          workspace_root,\n          String(args.path || workspace_root),\n          Number(args.depth) || 3,\n        )\n""",
              """        return window.editor_api.workspace.agent_list(\n          workspace_root,\n          String(args.path || workspace_root),\n          Number(args.depth) || 3,\n          args.optional === true,\n        )\n""",
          )

          replace(
              'src/chat/editorFileAuthority.ts',
              """      if (tool_name === 'files.read') {\n        const disk = await window.editor_api.workspace.agent_read_file(workspace_root, file_path)\n        const snapshot = host.get_snapshot(disk.path)\n""",
              """      if (tool_name === 'files.read') {\n        const disk = await window.editor_api.workspace.agent_read_file(workspace_root, file_path, args.optional === true)\n        if (disk.missing) {\n          return { ...disk, isBinary: false }\n        }\n        const snapshot = host.get_snapshot(disk.path)\n""",
          )

          replace(
              'src/platform/projectSkillLoader.ts',
              """export interface ProjectSkillIO {\n  listDirectory: (path: string, depth?: number) => Promise<{ rootPath: string; tree: BridgeFileNode }>\n  readTextFile: (path: string, options?: Record<string, unknown>) => Promise<{ content: string }>\n}\n""",
              """export interface ProjectSkillIO {\n  listDirectory: (\n    path: string,\n    depth?: number,\n    options?: Record<string, unknown>,\n  ) => Promise<{ rootPath: string; tree: BridgeFileNode; missing?: boolean }>\n  readTextFile: (\n    path: string,\n    options?: Record<string, unknown>,\n  ) => Promise<{ content: string; missing?: boolean }>\n}\n""",
          )

          replace(
              'src/platform/projectSkillLoader.ts',
              """    const result = await io.readTextFile(workspace_path(workspace_root, PROJECT_SKILL_SETTINGS), {\n      startLine: 1,\n      lineCount: 400,\n    })\n    const content = String(result.content || '').slice(0, 20000)\n""",
              """    const result = await io.readTextFile(workspace_path(workspace_root, PROJECT_SKILL_SETTINGS), {\n      startLine: 1,\n      lineCount: 400,\n      optional: true,\n    })\n    if (result.missing) return { enabled: true, skills: {} } satisfies ProjectSkillSettings\n    const content = String(result.content || '').slice(0, 20000)\n""",
          )

          replace(
              'src/platform/projectSkillLoader.ts',
              """    const listing = await io.listDirectory(workspace_path(root, PROJECT_SKILL_DIRECTORY), 3)\n    tree = listing.tree\n""",
              """    const listing = await io.listDirectory(workspace_path(root, PROJECT_SKILL_DIRECTORY), 3, { optional: true })\n    if (listing.missing) return [] as BridgeSkillDefinition[]\n    tree = listing.tree\n""",
          )

          replace(
              'src/platform/desktopBridge.ts',
              """export async function listDirectory(path: string, depth = 3): Promise<{ rootPath: string; tree: BridgeFileNode }> {\n  if (editor_file_authority) {\n    return (await editor_file_authority.execute('files.list', { path, depth })) as {\n      rootPath: string\n      tree: BridgeFileNode\n    }\n  }\n  return base.listDirectory(path, depth)\n}\n""",
              """export async function listDirectory(\n  path: string,\n  depth = 3,\n  options: BridgeOptions = {},\n): Promise<{ rootPath: string; tree: BridgeFileNode; missing?: boolean }> {\n  if (editor_file_authority) {\n    return (await editor_file_authority.execute('files.list', { ...options, path, depth })) as {\n      rootPath: string\n      tree: BridgeFileNode\n      missing?: boolean\n    }\n  }\n  return base.listDirectory(path, depth)\n}\n""",
          )

          replace(
              'tests/editorFileAuthority.test.ts',
              """  it('blocks a workspace symlink that resolves outside the workspace', async () => {\n""",
              """  it('treats missing optional project-skill paths as an expected state', async () => {\n    const { list_agent_workspace, read_agent_workspace_file } = await import('../electron/workspace.cts')\n    const root = await mkdtemp(join(tmpdir(), 'code-editor-workspace-'))\n    const settings_path = join(root, '.iris', 'skills.json')\n    const skills_path = join(root, '.iris', 'skills')\n\n    await expect(read_agent_workspace_file(root, settings_path, true)).resolves.toMatchObject({\n      path: settings_path,\n      missing: true,\n    })\n    await expect(list_agent_workspace(root, skills_path, 3, true)).resolves.toMatchObject({\n      rootPath: skills_path,\n      missing: true,\n      tree: { path: skills_path, type: 'directory', children: [] },\n    })\n    await expect(read_agent_workspace_file(root, settings_path)).rejects.toThrow(/does not exist/i)\n  })\n\n  it('blocks a workspace symlink that resolves outside the workspace', async () => {\n""",
          )

          replace(
              'tests/projectSkills.test.ts',
              """  it('loads bounded project skills and applies project settings', async () => {\n""",
              """  it('uses non-throwing optional probes when project skills are absent', async () => {\n    bridge_state.tree = null\n    const readTextFile = vi.fn(async (_path: string, options?: Record<string, unknown>) => ({\n      content: '',\n      missing: options?.optional === true,\n    }))\n    const listDirectory = vi.fn(\n      async (_path: string, _depth?: number, options?: Record<string, unknown>) => ({\n        rootPath: '/workspace/.iris/skills',\n        tree: { name: 'skills', path: '/workspace/.iris/skills', type: 'directory' as const, children: [] },\n        missing: options?.optional === true,\n      }),\n    )\n\n    await expect(loadProjectSkillDefinitions('/workspace', { listDirectory, readTextFile })).resolves.toEqual([])\n    expect(readTextFile).toHaveBeenCalledWith(\n      '/workspace/.iris/skills.json',\n      expect.objectContaining({ optional: true }),\n    )\n    expect(listDirectory).toHaveBeenCalledWith('/workspace/.iris/skills', 3, { optional: true })\n  })\n\n  it('loads bounded project skills and applies project settings', async () => {\n""",
          )
          PY

      - name: Format changed files
        run: npx prettier --write electron/workspace.cts electron/preload.cts src/types/electron.d.ts src/chat/editorFileAuthority.ts src/platform/projectSkillLoader.ts src/platform/desktopBridge.ts tests/editorFileAuthority.test.ts tests/projectSkills.test.ts

      - name: Run focused regressions
        run: npx vitest run tests/editorFileAuthority.test.ts tests/projectSkills.test.ts

      - name: Verify repository
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npm run verify:full

      - name: Commit repair
        run: |
          git config user.name "Jared"
          git config user.email "jaredturck8@gmail.com"
          git add electron/workspace.cts electron/preload.cts src/types/electron.d.ts src/chat/editorFileAuthority.ts src/platform/projectSkillLoader.ts src/platform/desktopBridge.ts tests/editorFileAuthority.test.ts tests/projectSkills.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Handle optional project skill probes" -m "Treat absent project-level skills.json and skills directories as an expected optional state without weakening normal agent filesystem errors or workspace containment." -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:main
