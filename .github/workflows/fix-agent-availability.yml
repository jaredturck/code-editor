name: Fix agent availability

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-agent-availability
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Apply narrow runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              'src/platform/agent/modelHealth.ts',
              "import { buildAgentRoster } from '@/platform/agent/modelTags'\nimport { readStorageJson, writeStorageJson, canUseLocalStorage } from '@/platform/localStorageStore'",
              "import { buildAgentRoster } from '@/platform/agent/modelTags'\nimport { hasKeyFor } from '@/platform/keyStore'\nimport { readStorageJson, writeStorageJson, canUseLocalStorage } from '@/platform/localStorageStore'\nimport { findAIProvider } from '@/platform/providers/providerRegistry'",
          )
          replace_once(
              'src/platform/agent/modelHealth.ts',
              "const PERSISTENT_COOLDOWN_MS = 6 * 60 * 60 * 1000\n",
              "const PERSISTENT_COOLDOWN_MS = 6 * 60 * 60 * 1000\nconst FAILOVER_RETRY_GRACE_MS = ERROR_COOLDOWN_MS\n",
          )
          replace_once(
              'src/platform/agent/modelHealth.ts',
              "export function parseModelHealthKey(key: string): { provider: string; model: string; keyId: string } | null {",
              "export function isModelCredentialReady(provider: unknown, keyId: unknown = '1'): boolean {\n  const definition = findAIProvider(provider)\n  if (!definition) return false\n  return !definition.requiresApiKey || hasKeyFor(definition.id, keyId)\n}\n\nexport function parseModelHealthKey(key: string): { provider: string; model: string; keyId: string } | null {",
          )
          replace_once(
              'src/platform/agent/modelHealth.ts',
              "  const failedKey = modelHealthKey(failed.provider, failed.model, failed.keyId)\n  const preferRole = opts.preferRole || 'orchestrator'\n  const healthy = buildAgentRoster(settings)\n    .filter((member) => member.provider && member.model)\n    .filter((member) => modelHealthKey(member.provider, member.model, member.keyId) !== failedKey)\n    .filter((member) => isModelHealthy(member.provider, member.model, member.keyId))",
              "  ensureHydrated()\n  const failedKey = modelHealthKey(failed.provider, failed.model, failed.keyId)\n  const preferRole = opts.preferRole || 'orchestrator'\n  const now = Date.now()\n  const healthy = buildAgentRoster(settings)\n    .filter((member) => member.provider && member.model)\n    .filter((member) => isModelCredentialReady(member.provider, member.keyId))\n    .filter((member) => modelHealthKey(member.provider, member.model, member.keyId) !== failedKey)\n    .filter((member) => {\n      const entry = registry.get(modelHealthKey(member.provider, member.model, member.keyId))\n      return !entry?.lastFailureAt || now - entry.lastFailureAt >= FAILOVER_RETRY_GRACE_MS\n    })\n    .filter((member) => isModelHealthy(member.provider, member.model, member.keyId))",
          )

          replace_once(
              'src/platform/orchestrationClient.ts',
              "import { recordModelFailure, isModelHealthy } from '@/platform/agent/modelHealth'\nimport { getKey } from '@/platform/keyStore'",
              "import { isModelCredentialReady, recordModelFailure, isModelHealthy } from '@/platform/agent/modelHealth'",
          )
          replace_once(
              'src/platform/orchestrationClient.ts',
              "function isMemberConnectable(member: RosterMember): boolean {\n  if (!member.provider || !member.model) return false\n  return member.provider === 'local' || Boolean(getKey(member.provider, member.keyId || '1'))\n}",
              "function isMemberConnectable(member: RosterMember): boolean {\n  if (!member.provider || !member.model) return false\n  return isModelCredentialReady(member.provider, member.keyId || '1')\n}",
          )
          replace_once(
              'src/platform/orchestrationClient.ts',
              "  if (!candidates.length) {\n    const resolved = resolveAgentRoleSettings(role, settings)\n    return { agentId: role, identity: resolved.identity, subSettings: resolved.settings }\n  }",
              "  if (!candidates.length) {\n    const resolved = resolveAgentRoleSettings(role, settings)\n    if (\n      resolved.identity.explicitlyAssigned &&\n      !isModelCredentialReady(resolved.identity.provider, resolved.identity.keyId)\n    ) {\n      throw new Error(`No available ${role} agent is configured.`)\n    }\n    return { agentId: role, identity: resolved.identity, subSettings: resolved.settings }\n  }",
          )

          replace_once(
              'src/platform/agent/runtime/sessionRunner.ts',
              "  recordModelFailure,\n  recordModelSuccess,\n  pickFailoverModel,",
              "  isModelCredentialReady,\n  recordModelFailure,\n  recordModelSuccess,\n  pickFailoverModel,",
          )
          replace_once(
              'src/platform/agent/runtime/sessionRunner.ts',
              "      const candidates = buildAgentRoster(settings)\n        .filter((member) => member.primary)\n        .map((member) => ({",
              "      const candidates = buildAgentRoster(settings)\n        .filter((member) => member.primary)\n        .filter((member) => isModelCredentialReady(member.provider, member.keyId))\n        .map((member) => ({",
          )
          replace_once(
              'src/platform/agent/runtime/sessionRunner.ts',
              "      // A configured model that can't connect (usually a missing/mismatched key) used to be\n      // dropped SILENTLY — the user saw \"models configured\" but an empty team. Surface each drop\n      // with its reason so the cause is visible instead of guessed.\n      for (const drop of pool.dropped || []) {\n        onEvent?.({\n          type: 'notice',\n          summary: `${drop.member.model || drop.member.role} (${drop.member.id}) isn't joining the team — ${drop.reason}. Fix it in Settings → Agents to bring this model online.`,\n          at: Date.now(),\n        })\n      }",
              "      // Unavailable configured members stay out of the runtime pool. Their configuration status\n      // belongs in Settings/diagnostics, not in the model reasoning timeline for every run.",
          )

          replace_once(
              'src/platform/agent/meshClient.ts',
              "import { buildAgentRoster, findPeers, deriveModelTags, type FindMatch } from '@/platform/agent/modelTags'\nimport { getRoutingProfile } from '@/platform/agent/modelRouting'",
              "import { buildAgentRoster, findPeers, deriveModelTags, type FindMatch } from '@/platform/agent/modelTags'\nimport { isModelCredentialReady } from '@/platform/agent/modelHealth'\nimport { getRoutingProfile } from '@/platform/agent/modelRouting'",
          )
          replace_once(
              'src/platform/agent/meshClient.ts',
              "import type { SubAgentSettings } from '@/platform/agent/subAgentTypes'\n\n// Consult runs are deliberately tiny",
              "import type { SubAgentSettings } from '@/platform/agent/subAgentTypes'\n\nfunction runtimeRoster(settings: SubAgentSettings) {\n  return buildAgentRoster(settings as Record<string, unknown>).filter(\n    (member) => member.provider && member.model && isModelCredentialReady(member.provider, member.keyId),\n  )\n}\n\nfunction runtimeMatches(matches: FindMatch[]): FindMatch[] {\n  return matches.filter((member) => isModelCredentialReady(member.provider, member.keyId))\n}\n\n// Consult runs are deliberately tiny",
          )
          replace_once(
              'src/platform/agent/meshClient.ts',
              "export function handleAgentFind(args: FindArgs, settings: SubAgentSettings): FindResult {\n  const matches = findPeers(settings as Record<string, unknown>, {\n    tags: args?.tags,\n    topic: args?.topic,\n    exclude: args?.exclude,\n    limit: args?.limit,\n  })",
              "export function handleAgentFind(args: FindArgs, settings: SubAgentSettings): FindResult {\n  const requestedLimit = Math.max(1, Math.min(16, Number(args?.limit) || 5))\n  const matches = runtimeMatches(\n    findPeers(settings as Record<string, unknown>, {\n      tags: args?.tags,\n      topic: args?.topic,\n      exclude: args?.exclude,\n      limit: 16,\n    }),\n  ).slice(0, requestedLimit)",
          )
          replace_once(
              'src/platform/agent/meshClient.ts',
              "    roster: buildAgentRoster(settings as Record<string, unknown>).map((m) => ({",
              "    roster: runtimeRoster(settings).map((m) => ({",
          )
          replace_once(
              'src/platform/agent/meshClient.ts',
              "  const roster = buildAgentRoster(settings as Record<string, unknown>)\n",
              "  const roster = runtimeRoster(settings)\n",
          )
          replace_once(
              'src/platform/agent/meshClient.ts',
              "  const matches = findPeers(settings as Record<string, unknown>, {\n    tags: args?.tags,\n    topic: args?.topic ?? args?.question,\n    exclude,\n    limit: 1,\n  })\n  return matches[0] || null",
              "  const matches = runtimeMatches(\n    findPeers(settings as Record<string, unknown>, {\n      tags: args?.tags,\n      topic: args?.topic ?? args?.question,\n      exclude,\n      limit: 16,\n    }),\n  )\n  return matches[0] || null",
          )
          replace_once(
              'src/platform/agent/meshClient.ts',
              "  const roster = buildAgentRoster(settings as Record<string, unknown>).filter((m) => m.role !== 'orchestrator')",
              "  const roster = runtimeRoster(settings).filter((m) => m.role !== 'orchestrator')",
          )
          replace_once(
              'src/platform/agent/meshClient.ts',
              "  const member = buildAgentRoster(settings as Record<string, unknown>).find((m) => m.role === 'overwatcher')",
              "  const member = runtimeRoster(settings).find((m) => m.role === 'overwatcher')",
          )
          replace_once(
              'src/platform/agent/meshClient.ts',
              "  return buildAgentRoster(settings as Record<string, unknown>)\n    .filter((member) => member.provider && member.model && member.role !== 'overwatcher')",
              "  return runtimeRoster(settings)\n    .filter((member) => member.role !== 'overwatcher')",
          )

          replace_once(
              'src/platform/modelProfiles.ts',
              "/** True for reasoning models (o-series, R1) that deliberate internally. */\nexport function isReasoningModel(provider: unknown, model: unknown): boolean {\n  return getModelCapabilities(provider, model).reasoning === true\n}",
              "/** True for reasoning models that may deliberate for a long time before answering. */\nexport function isReasoningModel(provider: unknown, model: unknown): boolean {\n  const modelName = String(model || '').toLowerCase()\n  // Qwen 3.6 currently falls through the generic Qwen capability family. Treat it as\n  // deliberative for timeout budgeting without changing its existing tool protocol.\n  if (/qwen3[.-]6/.test(modelName)) return true\n  return getModelCapabilities(provider, model).reasoning === true\n}",
          )

          replace_once(
              'src/platform/subAgentRuntime.ts',
              "  // Per-call timeout cap — reasoning models (o-series, R1, etc.) deliberate longer\n  // before they emit a token, so they get the larger cap.\n  const modelCallCap = isReasoningModel(settings?.ai_provider, settings?.ai_model)\n    ? SUB_AGENT_REASONING_CALL_TIMEOUT_MS\n    : SUB_AGENT_MODEL_CALL_TIMEOUT_MS",
              "  // Per-call timeout cap — reasoning models deliberate longer before they emit a token.\n  // Resolve this from the ACTIVE settings so failover to a different model also gets the right cap.\n  const modelCallTimeoutMs = (requestSettings: SubAgentSettings): number =>\n    isReasoningModel(requestSettings?.ai_provider, requestSettings?.ai_model)\n      ? SUB_AGENT_REASONING_CALL_TIMEOUT_MS\n      : SUB_AGENT_MODEL_CALL_TIMEOUT_MS",
          )
          replace_once(
              'src/platform/subAgentRuntime.ts',
              "    const callTimeoutMs = Math.min(remainingMs, modelCallCap)",
              "    const callTimeoutMs = Math.min(remainingMs, modelCallTimeoutMs(activeSettings))",
          )

          replace_once(
              'tests/platform/modelHealth.test.ts',
              "import { beforeEach, describe, expect, it } from 'vitest'\nimport {",
              "import { beforeEach, describe, expect, it } from 'vitest'\nimport { setKey } from '@/platform/keyStore'\nimport {",
          )
          replace_once(
              'tests/platform/modelHealth.test.ts',
              "describe('modelHealth', () => {\n  beforeEach(() => resetModelHealth())",
              "describe('modelHealth', () => {\n  beforeEach(() => {\n    resetModelHealth()\n    setKey('anthropic', 'test-key-1', '1')\n    setKey('anthropic', 'test-key-2', '2')\n  })",
          )
          replace_once(
              'tests/platform/modelHealth.test.ts',
              "  it('skips a suspended candidate when picking a replacement', () => {",
              "  it('never selects a credential-required backup with no saved key', () => {\n    const pool = {\n      agent_models: [\n        { role: 'executor', provider: 'local', model: 'qwen3.6:27b', keyId: '1', primary: true },\n        { role: 'orchestrator', provider: 'openai', model: 'gpt-5.1-codex-max', keyId: '1', primary: true },\n      ],\n    }\n    expect(\n      pickFailoverModel(pool as never, { provider: 'local', model: 'qwen3.6:27b', keyId: '1' }),\n    ).toBeNull()\n  })\n\n  it('does not immediately cycle back to a model that already failed in the same failover window', () => {\n    const pool = {\n      agent_models: [\n        { role: 'executor', provider: 'local', model: 'worker-a', keyId: '1', primary: true },\n        { role: 'scout', provider: 'local', model: 'worker-b', keyId: '1', primary: true },\n      ],\n    }\n    recordModelFailure('local', 'worker-a', '1', { error: 'timeout' })\n    expect(\n      pickFailoverModel(pool as never, { provider: 'local', model: 'worker-a', keyId: '1' })?.model,\n    ).toBe('worker-b')\n    recordModelFailure('local', 'worker-b', '1', { error: 'timeout' })\n    expect(\n      pickFailoverModel(pool as never, { provider: 'local', model: 'worker-b', keyId: '1' }),\n    ).toBeNull()\n  })\n\n  it('skips a suspended candidate when picking a replacement', () => {",
          )

          replace_once(
              'tests/platform/orchestrationClient.test.ts',
              "  it('can post without waiting for idle', async () => {",
              "  it('rejects an explicitly assigned cloud delegate before starting a loop when its key is unavailable', async () => {\n    await expect(\n      handleAgentDelegate(\n        { toAgent: 'executor', instructions: 'Do the work' },\n        {\n          agent_multi_enabled: true,\n          agent_models: [\n            {\n              role: 'executor',\n              provider: 'openai',\n              model: 'gpt-5.1-codex-max',\n              keyId: '1',\n              primary: true,\n            },\n          ],\n        },\n      ),\n    ).rejects.toThrow('No available executor agent is configured')\n    expect(runtime.startSubAgentLoop).not.toHaveBeenCalled()\n  })\n\n  it('can post without waiting for idle', async () => {",
          )

          replace_once(
              'tests/platform/modelMesh.test.ts',
              "import { describe, expect, it } from 'vitest'",
              "import { beforeEach, describe, expect, it } from 'vitest'",
          )
          replace_once(
              'tests/platform/modelMesh.test.ts',
              "import { deriveModelTags, topicToTags, buildAgentRoster, findPeers } from '@/platform/agent/modelTags'",
              "import { deriveModelTags, topicToTags, buildAgentRoster, findPeers } from '@/platform/agent/modelTags'\nimport { clearKey, setKey } from '@/platform/keyStore'",
          )
          replace_once(
              'tests/platform/modelMesh.test.ts',
              "const MESH_ON = {",
              "beforeEach(() => {\n  setKey('anthropic', 'test-anthropic-key')\n  setKey('opencode', 'test-opencode-key')\n  setKey('openai', 'test-openai-key')\n})\n\nconst MESH_ON = {",
          )
          replace_once(
              'tests/platform/modelMesh.test.ts',
              "  it('reports unavailable when no overwatcher is configured (no model call)', async () => {",
              "  it('treats a configured cloud overwatcher with no key as unavailable', () => {\n    clearKey('openai')\n    expect(hasOverwatcher(OW as never)).toBe(false)\n    expect(resolveOverwatcher(OW as never)).toBeNull()\n  })\n\n  it('reports unavailable when no overwatcher is configured (no model call)', async () => {",
          )

          Path('tests/platform/modelProfiles.test.ts').write_text("""import { describe, expect, it } from 'vitest'\nimport { isReasoningModel } from '@/platform/modelProfiles'\n\ndescribe('modelProfiles', () => {\n  it('gives Qwen 3.6 the deliberative model timeout budget', () => {\n    expect(isReasoningModel('local', 'qwen3.6:27b')).toBe(true)\n  })\n})\n""")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changes
        run: npx prettier --write src/platform/agent/modelHealth.ts src/platform/orchestrationClient.ts src/platform/agent/runtime/sessionRunner.ts src/platform/agent/meshClient.ts src/platform/modelProfiles.ts src/platform/subAgentRuntime.ts tests/platform/modelHealth.test.ts tests/platform/orchestrationClient.test.ts tests/platform/modelMesh.test.ts tests/platform/modelProfiles.test.ts

      - name: Verify repository
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npm run verify:full

      - name: Commit verified fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-agent-availability.yml
          git add src tests
          git commit -m "Fix unavailable agent selection and local timeout handling" -m "Filter credentialless cloud models before runtime selection, prevent immediate failover cycling, keep unavailable configuration out of the reasoning timeline, and give Qwen 3.6 the deliberative sub-agent timeout budget." -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:main
