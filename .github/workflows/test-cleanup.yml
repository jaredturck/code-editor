name: Test Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Consolidate tests and remove benchmarks
        run: |
          set -euo pipefail

          rm -rf benchmarks
          rm -f tsconfig.benchmark.json vitest.iris.config.ts

          rm -f \
            migrated-tests/iris/lib/AuthContext.test.tsx \
            migrated-tests/iris/lib/legacyApiRetirement.test.ts \
            migrated-tests/iris/lib/localProfileClient.test.ts \
            migrated-tests/iris/lib/orbTextures.test.ts \
            migrated-tests/iris/lib/runtimeModularization.test.ts \
            migrated-tests/iris/lib/workspaceResize.test.ts

          mkdir -p tests/platform tests/backend tests/fixtures tests/helpers

          for file in migrated-tests/iris/lib/*.test.ts; do
            target="tests/platform/$(basename "$file")"
            test ! -e "$target"
            git mv "$file" "$target"
          done

          for file in migrated-tests/iris/server/*.test.ts; do
            target="tests/backend/$(basename "$file")"
            test ! -e "$target"
            git mv "$file" "$target"
          done

          git mv migrated-tests/iris/server/bridgeRouteTestHarness.ts tests/backend/bridgeRouteTestHarness.ts
          git mv migrated-tests/iris/fixtures/documentFixtures.ts tests/fixtures/documentFixtures.ts
          git mv migrated-tests/iris/fixtures/workspace tests/fixtures/workspace
          git mv migrated-tests/iris/helpers/http.ts tests/helpers/http.ts
          git mv migrated-tests/iris/setup.ts tests/runtimeSetup.ts
          rm -rf migrated-tests

          python <<'PY'
          import json
          import re
          from pathlib import Path

          def rewrite_source_paths(text):
              text = text.replace("'../../../src/", "'../../src/")
              text = text.replace('"../../../src/', '"../../src/')
              text = text.replace("'../../../backend/", "'../../backend/")
              text = text.replace('"../../../backend/', '"../../backend/')
              text = text.replace("'../../../electron/", "'../../electron/")
              text = text.replace('"../../../electron/', '"../../electron/')
              text = text.replace("'../../server/", "'../../backend/")
              text = text.replace('"../../server/', '"../../backend/')
              text = text.replace("'../../src/lib/providers/", "'../../src/platform/providers/")
              text = text.replace('"../../src/lib/providers/', '"../../src/platform/providers/')
              text = text.replace('migrated-tests/iris/fixtures/workspace', 'tests/fixtures/workspace')
              text = re.sub(r"(['\"]\.\./\.\./backend/[^'\"]+)\.js(['\"])", r'\1\2', text)
              return re.sub(r"(['\"]\.\./\.\./src/platform/providers/[^'\"]+)\.js(['\"])", r'\1\2', text)

          for folder in [Path('tests/platform'), Path('tests/backend')]:
              for path in sorted(folder.glob('*.test.ts')):
                  path.write_text(rewrite_source_paths(path.read_text()))

          harness_path = Path('tests/backend/bridgeRouteTestHarness.ts')
          harness_path.write_text(rewrite_source_paths(harness_path.read_text()))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['test'] = 'npm run build:backend && npm run build:electron && vitest run'
          for script in ['test:iris', 'benchmark', 'benchmark:iris']:
              package['scripts'].pop(script, None)
          package.get('devDependencies', {}).pop('vite-node', None)
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          config_path = Path('vitest.config.ts')
          config = config_path.read_text()
          old_test_config = "  test: {\n    environment: 'jsdom',\n    setupFiles: ['./tests/setup.ts'],\n    include: ['tests/**/*.test.ts', 'tests/**/*.test.tsx'],\n  },"
          new_test_config = (
              "  test: {\n"
              "    environment: 'jsdom',\n"
              "    projects: [\n"
              "      {\n"
              "        test: {\n"
              "          name: 'editor',\n"
              "          setupFiles: ['./tests/setup.ts'],\n"
              "          include: ['tests/*.test.ts', 'tests/*.test.tsx'],\n"
              "        },\n"
              "      },\n"
              "      {\n"
              "        test: {\n"
              "          name: 'runtime',\n"
              "          setupFiles: ['./tests/runtimeSetup.ts'],\n"
              "          include: ['tests/platform/**/*.test.ts', 'tests/backend/**/*.test.ts'],\n"
              "        },\n"
              "      },\n"
              "    ],\n"
              "  },"
          )
          if old_test_config not in config:
              raise SystemExit('Expected Vitest test configuration was not found')
          config_path.write_text(config.replace(old_test_config, new_test_config))

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace('- Preserved local IRIS benchmark suite available through `npm run benchmark`\n', '')
          readme = readme.replace(
              '`npm test` runs the Code Editor integration suite and then the compatible migrated IRIS runtime suite. `npm run verify:full` runs the complete correctness/build verification sequence. The benchmark suite is intentionally separate and can be run with `npm run benchmark`; it may use configured loopback Ollama models and writes retained benchmark history under `~/.iris-ai/`.',
              '`npm test` runs the complete centralized Code Editor test tree through isolated editor and runtime test projects. `npm run verify:full` runs the complete correctness/build verification sequence.',
          )
          readme_path.write_text(readme)

          cleanup_path = Path('docs/CODE_CLEANUP_REVIEW.md')
          cleanup = cleanup_path.read_text()
          cleanup = cleanup.replace('- benchmark source under `benchmarks/iris/`;\n', '')
          cleanup = cleanup.replace('active tests/benchmarks', 'active tests')
          cleanup_path.write_text(cleanup)

          migration_path = Path('docs/MIGRATION.md')
          migration = migration_path.read_text()
          migration = re.sub(
              r'^\| `migrated-tests/iris/`.*$',
              '| `tests/platform/`, `tests/backend/` | Consolidated runtime/backend regression tests retained from the migrated platform |',
              migration,
              flags=re.MULTILINE,
          )
          migration = re.sub(r'^\| `benchmarks/iris/`.*\n', '', migration, flags=re.MULTILINE)
          migration = migration.replace(
              '4. The important migrated runtime/backend tests and benchmark harness were retained.',
              '4. The important migrated runtime/backend tests were retained and later consolidated into the normal `tests/` tree; the standalone benchmark harness was removed after migration because it was not part of the product or CI.',
          )
          tests_section = (
              '### Tests\n\n'
              '**IRIS source:** original IRIS runtime/backend tests  \n'
              '**Current destination:** `tests/platform/` and `tests/backend/`\n\n'
              'The original tests were initially preserved outside the normal Code Editor Vitest include path so migration did not pretend old presentation tests remained valid against a different UI. After migration completion, useful runtime/backend coverage was consolidated into the normal `tests/` tree. The normal Vitest configuration isolates editor tests from runtime/backend tests so their shared setup does not leak between groups. Presentation-only and migration-only tests were retired.\n\n'
              'The standalone IRIS benchmark harness was removed during post-migration cleanup because it was not connected to product behavior or CI.\n\n'
              '### Historical IRIS documentation'
          )
          migration = re.sub(r'### Tests and benchmarks\n.*?### Historical IRIS documentation', tests_section, migration, flags=re.DOTALL)
          preserved_tests = (
              '### Preserved tests\n\n'
              '`tests/platform/` and `tests/backend/` retain useful runtime/backend regression coverage from the original test heritage alongside the Code Editor\'s integration-specific tests.\n\n'
              '### Git history'
          )
          migration = re.sub(r'### Preserved tests\n.*?### Git history', preserved_tests, migration, flags=re.DOTALL)
          unified_test_text = '`npm test` performs backend/Electron builds and runs the centralized Code Editor tests as isolated editor and runtime projects, including platform and backend regression coverage under `tests/`.\n\n### Verification state at documentation consolidation'
          migration = re.sub(r'`npm test` performs backend/Electron builds,.*?### Verification state at documentation consolidation', unified_test_text, migration, flags=re.DOTALL)
          migration = migration.replace('- [x] Compatible migrated IRIS tests in `npm test`', '- [x] Consolidated platform/backend regression coverage in `npm test`')
          migration = migration.replace('- [x] Preserved benchmark harness in `npm run benchmark`\n', '')
          migration_path.write_text(migration)
          PY

          npm install --package-lock-only --ignore-scripts

          npx prettier --write \
            package.json \
            package-lock.json \
            vitest.config.ts \
            README.md \
            tests/platform \
            tests/backend \
            tests/runtimeSetup.ts \
            docs/MIGRATION.md \
            docs/CODE_CLEANUP_REVIEW.md

          if git grep -n -E 'migrated-tests/iris|vitest\.iris|test:iris|benchmarks/iris|npm run benchmark' -- \
            ':!docs/iris-reference/**' \
            ':!docs/REMOVED_CODE.md' \
            ':!.github/workflows/test-cleanup.yml'; then
            echo 'Stale migration-test or benchmark references remain.' >&2
            exit 1
          fi

          if git grep -n -E "['\"]\.\./\.\./\.\./(src|backend|electron)/|['\"]\.\./\.\./server/|['\"]\.\./\.\./src/lib/providers/" -- tests/platform tests/backend; then
            echo 'Moved tests still contain stale source paths.' >&2
            exit 1
          fi

      - name: Verify repository
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npm run verify:full

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'Jared'
          git config user.email 'jaredturck8@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Consolidate tests and remove benchmarks' -m 'Move retained runtime and backend regression coverage into the normal tests tree, retire migration-only leftovers, and remove the unused benchmark harness and scripts.' -m 'Co-authored-by: ChatGPT <noreply@openai.com>'
          git push origin HEAD:main
